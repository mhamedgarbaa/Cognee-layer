version: "3.9"

services:
  db:
    image: postgres:15
    container_name: workspace_db
    environment:
      POSTGRES_USER: workspace_user
      POSTGRES_PASSWORD: workspace_pass
      POSTGRES_DB: workspace_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace_user -d workspace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  cognee-mcp:
    image: cognee/cognee-mcp:main
    container_name: cognee_mcp_server
    environment:
      - TRANSPORT_MODE=http
      - LLM_PROVIDER=ollama
      - LLM_MODEL=mistral
      - LLM_ENDPOINT=http://host.docker.internal:11434
      - LLM_API_KEY=ollama  # Dummy key for Ollama (not authenticated)
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_ENDPOINT=http://host.docker.internal:11434
      - EMBEDDING_DIMENSIONS=768  # nomic-embed-text dimension
      - HUGGINGFACE_TOKENIZER=nomic-ai/nomic-embed-text-v1
      - DB_PROVIDER=sqlite
      - VECTOR_DB_PROVIDER=lancedb
      - GRAPH_DATABASE_PROVIDER=kuzu
    volumes:
      - cognee_data:/root/.cognee_system
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: workspace_api
    depends_on:
      db:
        condition: service_healthy
      cognee-mcp:
        condition: service_healthy
    environment:
      POSTGRES_URI: "postgresql+asyncpg://workspace_user:workspace_pass@db:5432/workspace_db"
      APP_ENV: "development"
      LOG_LEVEL: "INFO"
      COGNEE_MCP_ENDPOINT: "http://cognee-mcp:8000/mcp"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: [
      "uvicorn",
      "app:app",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--reload"
    ]

volumes:
  pgdata:
  cognee_data:
